application:
  subdomain: home-ktv
  entries:
    - id: main
      path: /m
      title: "手机点歌"
    - id: admin
      path: /m/admin
      title: "管理后台"
  upstreams:
    - location: /
      backend: http://ktv:8080/
  ingress:
    - port: 18888
      protocol: udp
      publish_port: 18888
  public_path:
    - /
services:
  db:
    # upstream: docker.io/library/postgres:16-alpine
    image: registry.lazycat.cloud/czyt/library/postgres:0b966445316029e8
    environment:
      - POSTGRES_DB=ktv
      - POSTGRES_USER=ktv
      - POSTGRES_PASSWORD={{ stable_secret "db_password" }}
      - TZ=Asia/Shanghai
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ktv -d ktv
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    binds:
      - /lzcapp/var/postgres:/var/lib/postgresql/data
    stop_grace_period: 1m
  ktv:
    # upstream: ghcr.io/zhayinggang/ktv-home:v1.0.6
    image: ghcr.1ms.run/zhayinggang/ktv-home:v1.0.6
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/ktv
      - SPRING_DATASOURCE_USERNAME=ktv
      - SPRING_DATASOURCE_PASSWORD={{ stable_secret "db_password" }}
      - KTV_SOURCE_LIBRARY_PATH=/source-music
      - KTV_LIBRARY_PATH=/music
      - KTV_DATA_PATH=/data
      - KTV_DISCOVERY_ENABLED=true
      - KTV_DISCOVERY_UDP_PORT=18888
      - KTV_DISCOVERY_NAME=家庭KTV
      - KTV_AI_ENABLED=false
      - KTV_AI_BASE_URL=https://api.deepseek.com
      - KTV_AI_API_KEY=
      - KTV_AI_MODEL=deepseek-v4-flash
      - KTV_AI_AUTO_APPLY_CONFIDENCE=0.90
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70 -Xmx512m
      - TZ=Asia/Shanghai
    depends_on:
      - db
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/api/health | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    binds:
      - /lzcapp/var/source-music:/source-music
      - /lzcapp/var/music:/music
      - /lzcapp/var/data:/data
    port: 8080
    stop_grace_period: 30s
