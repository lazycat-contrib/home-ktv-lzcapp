version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: ktv

build:
  run_buildscript: false

images:
  - id: ktv
    target: service
    service: ktv
    source: ghcr.io/zhayinggang/ktv-home
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    version_regex: '^v?(?P<version>\d+\.\d+\.\d+)$'
    version_template: '{version}'
    delivery:
      mode: lazycat
  - id: db
    target: service
    service: db
    source: docker.io/library/postgres
    channel: custom
    tag_regex: '^16-alpine$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: true
    continue_if_newer_version: true
    skip_if_version_exists: true
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Home KTV
    summary: "一个局域网的私人 KTV 系统"